<!doctype html>
<html><head><meta charset="utf-8"><title>Employee Management System</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px}
input,button{padding:10px;margin:5px}.card{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px}</style>
</head><body>
<h1>Employee Management System</h1><p>Frontend → API → PostgreSQL</p>
<input id="name" placeholder="Name"><input id="description" placeholder="Description">
<button onclick="add()">Add</button><div id="list"></div>
<script>
const API=location.hostname==="localhost"?"http://localhost:8000":"";
async function load(){const r=await fetch(API+"/items");const d=await r.json();
list.innerHTML=d.map(x=>`<div class="card"><b>${x.name}</b><br>${x.description||""}</div>`).join("")}
async function add(){await fetch(API+"/items",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({name:name.value,description:description.value})});name.value="";description.value="";load()} load();
</script></body></html>
